# Development override for docker-compose
version: '3.8'
services:
  backend:
    build:
      target: development
    environment:
      - NODE_ENV=development
    volumes:
      - ./backend:/app
      - /app/node_modules
      - /app/dist
    command: ["pnpm", "dev"]

  frontend:
    build:
      target: development
    environment:
      - NODE_ENV=development
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: ["pnpm", "dev"]

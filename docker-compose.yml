version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: pemilu-postgres
    environment:
      POSTGRES_DB: pemilu
      POSTGRES_USER: pemilu_user
      POSTGRES_PASSWORD: pemilu_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./backend/prisma/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pemilu_user -d pemilu"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
